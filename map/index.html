<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map | DispaUK</title>
  <meta name="description" content="DispaUK operations map with dispatch coverage borders, counties and station names.">
  <meta name="theme-color" content="#0b1220">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    #map { height: min(78vh, 720px); width: 100%; border-radius: 10px; border: 1px solid var(--border); z-index: 1; }
    .map-toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
    .map-toolbar label { font-size: 0.85rem; color: var(--text-muted); }
    .map-toolbar select {
      padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text); font: inherit;
    }
    .leaflet-container { background: #0b1220; font-family: var(--font); }
    .station-label {
      background: rgba(11, 18, 32, 0.88);
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 4px;
      color: #e8eef7;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 5px;
      white-space: nowrap;
      box-shadow: 0 1px 4px rgba(0,0,0,0.4);
      pointer-events: none;
    }
    .station-label::before { display: none; }
    .dc-label {
      background: rgba(59, 130, 246, 0.9);
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 4px;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 6px;
      white-space: nowrap;
      box-shadow: 0 1px 4px rgba(0,0,0,0.45);
    }
    .dc-label::before { display: none; }
    .map-status {
      margin-top: 8px; font-size: 0.85rem; color: var(--text-muted); min-height: 1.2em;
    }
    .map-status.error { color: #fca5a5; }
  </style>
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="/" class="logo"><span class="logo-mark">DU</span><span class="logo-text">DispaUK</span></a>
      <nav class="nav" aria-label="Primary">
        <a href="/">Dashboard</a>
        <a href="/dispatch/">Dispatch</a>
        <a href="/stations/">Stations</a>
        <a href="/fleet/">Fleet</a>
        <a href="/locate/">Locate</a>
        <a href="/map/">Map</a>
        <a href="/regions/">Regions</a>
        <a href="/statistics/">Statistics</a>
        <a href="/status/">Status</a>
      </nav>
      <button class="nav-toggle" type="button" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
    </div>
  </header>
  <main class="legal-page">
    <div class="container">
      <div class="section-header-left" style="margin-bottom:12px">
        <span class="section-kicker">GEOGRAPHY</span>
        <h1 style="font-size:1.6rem">Operations map</h1>
        <p class="text-muted">Coverage = convex hull of stations assigned to each dispatch centre. Approximate only — not official emergency boundaries.</p>
      </div>

      <div class="map-toolbar">
        <div class="filter-row" role="group" aria-label="Service filter">
          <button type="button" class="filter-btn active" data-map-filter="all">All</button>
          <button type="button" class="filter-btn" data-map-filter="fire">Fire</button>
          <button type="button" class="filter-btn" data-map-filter="ambulance">Ambulance</button>
          <button type="button" class="filter-btn" data-map-filter="police">Police</button>
          <button type="button" class="filter-btn" data-map-filter="other">Other</button>
        </div>
        <label>
          Dispatch centre
          <select id="dc-select"><option value="">All centres</option></select>
        </label>
        <label style="display:inline-flex;align-items:center;gap:6px">
          <input type="checkbox" id="show-coverage" checked> Borders
        </label>
        <label style="display:inline-flex;align-items:center;gap:6px">
          <input type="checkbox" id="show-labels" checked> Names
        </label>
        <label style="display:inline-flex;align-items:center;gap:6px">
          <input type="checkbox" id="show-counties"> Nations / regions
        </label>
      </div>

      <div id="map" role="application" aria-label="Station map"></div>
      <p class="map-status" id="map-status" aria-live="polite"></p>
      <p class="text-muted" style="margin-top:6px" aria-live="polite">
        <span data-map-count>Loading…</span> stations · <span data-dc-count>…</span> centres
      </p>
    </div>
  </main>
  <footer class="footer-slim"><div class="container footer-bottom"><p class="footer-copy">© <span data-current-year>2026</span> DispaUK · <a href="/status/">Status</a></p></div></footer>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="/script.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const statusEl = document.getElementById('map-status');
      const setStatus = (msg, isError) => {
        statusEl.textContent = msg || '';
        statusEl.classList.toggle('error', !!isError);
      };

      const map = L.map('map', { zoomControl: true }).setView([52.5, -1.5], 7);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
        maxZoom: 19,
        className: 'map-tiles-light',
      }).addTo(map);

      const style = document.createElement('style');
      style.textContent = '.map-tiles-light { filter: invert(1) hue-rotate(180deg) brightness(0.9) contrast(0.95); }';
      document.head.appendChild(style);

      let data;
      try {
        const res = await fetch('/data/stats.json', { cache: 'no-cache' });
        if (!res.ok) throw new Error('fetch failed');
        data = await res.json();
      } catch (e) {
        document.querySelector('[data-map-count]').textContent = 'Failed to load';
        document.querySelector('[data-dc-count]').textContent = '—';
        setStatus('Could not load station data.', true);
        return;
      }

      const stations = (data.stations || []).filter(s => s.lat != null && s.lon != null);
      const dcs = (data.dispatchCentres || []).filter(d => d.lat != null && d.lon != null);

      const stationLayer = L.layerGroup().addTo(map);
      const coverageLayer = L.layerGroup().addTo(map);
      const dcLayer = L.layerGroup().addTo(map);
      const countyLayer = L.layerGroup();

      let filter = 'all', dcFilter = '';
      let showCoverage = true, showLabels = true, showCounties = false;

      const palette = ['#ef4444','#3b82f6','#a78bfa','#22c55e','#f59e0b','#06b6d4','#f472b6','#eab308','#94a3b8','#fb7185','#14b8a6','#f97316'];
      const dcColour = {};
      dcs.forEach((d, i) => { dcColour[d.id] = palette[i % palette.length]; });

      const bucket = (type) => {
        const t = (type || '').toLowerCase();
        if (t.includes('fire')) return 'fire';
        if (t.includes('ambulance') || t.includes('hospital') || t.includes('hart')) return 'ambulance';
        if (t.includes('police') || t.includes('custody')) return 'police';
        return 'other';
      };
      const colours = { fire: '#e63946', ambulance: '#3b82f6', police: '#a78bfa', other: '#9aadc2' };

      function convexHull(points) {
        const pts = points.filter(p => p && p[0] != null && p[1] != null).map(p => [Number(p[0]), Number(p[1])]);
        const uniq = [], seen = new Set();
        pts.forEach(p => {
          const k = p[0].toFixed(6) + ',' + p[1].toFixed(6);
          if (!seen.has(k)) { seen.add(k); uniq.push(p); }
        });
        if (uniq.length < 3) return uniq.length ? uniq : null;
        uniq.sort((a, b) => a[1] - b[1] || a[0] - b[0]);
        const cross = (o, a, b) => (a[1] - o[1]) * (b[0] - o[0]) - (a[0] - o[0]) * (b[1] - o[1]);
        const lower = [];
        for (const p of uniq) {
          while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop();
          lower.push(p);
        }
        const upper = [];
        for (let i = uniq.length - 1; i >= 0; i--) {
          const p = uniq[i];
          while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop();
          upper.push(p);
        }
        upper.pop(); lower.pop();
        const hull = lower.concat(upper);
        return hull.length >= 3 ? hull : null;
      }

      function padHull(hull, padDeg) {
        if (!hull || hull.length < 3) return hull;
        let cLat = 0, cLon = 0;
        hull.forEach(p => { cLat += p[0]; cLon += p[1]; });
        cLat /= hull.length; cLon /= hull.length;
        return hull.map(([lat, lon]) => {
          const dLat = lat - cLat, dLon = lon - cLon;
          const len = Math.sqrt(dLat * dLat + dLon * dLon) || 1;
          const scale = 1 + padDeg / len;
          return [cLat + dLat * scale, cLon + dLon * scale];
        });
      }

      const coverageByDc = {};
      dcs.forEach(d => {
        const members = stations.filter(s => String(s.dcId) === String(d.id) && s.typeId !== 7);
        const pts = members.map(s => [s.lat, s.lon]);
        if (d.lat != null && d.lon != null) pts.push([d.lat, d.lon]);
        let hull = convexHull(pts);
        if (!hull && d.coveragePolygon && d.coveragePolygon.length >= 3) {
          hull = d.coveragePolygon.map(p => [p[0], p[1]]);
        }
        if (hull && hull.length >= 3) {
          coverageByDc[d.id] = padHull(hull, 0.02);
        } else if (d.lat != null && d.lon != null) {
          const r = 0.05;
          coverageByDc[d.id] = [[d.lat + r, d.lon], [d.lat, d.lon + r], [d.lat - r, d.lon], [d.lat, d.lon - r]];
        }
      });

      const sel = document.getElementById('dc-select');
      dcs.forEach(d => {
        const o = document.createElement('option');
        o.value = String(d.id);
        o.textContent = `${d.name} (${d.stationCount || 0})`;
        sel.appendChild(o);
      });
      document.querySelector('[data-dc-count]').textContent = String(dcs.length);

      let countiesLoaded = false;
      async function loadCounties() {
        if (countiesLoaded) return true;
        setStatus('Loading nation boundaries…');
        // Reliable CDN (jsDelivr) — England, Scotland, Wales, NI outlines
        const parts = [
          { url: 'https://cdn.jsdelivr.net/npm/world-geojson@3.4.0/areas/united_kingdom/england.json', name: 'England' },
          { url: 'https://cdn.jsdelivr.net/npm/world-geojson@3.4.0/areas/united_kingdom/scotland.json', name: 'Scotland' },
          { url: 'https://cdn.jsdelivr.net/npm/world-geojson@3.4.0/areas/united_kingdom/wales.json', name: 'Wales' },
          { url: 'https://cdn.jsdelivr.net/npm/world-geojson@3.4.0/areas/united_kingdom/northern_ireland.json', name: 'Northern Ireland' },
        ];
        const coloursN = { England: '#64748b', Scotland: '#3b82f6', Wales: '#22c55e', 'Northern Ireland': '#a78bfa' };
        let ok = 0;
        for (const part of parts) {
          try {
            const res = await fetch(part.url);
            if (!res.ok) continue;
            const geo = await res.json();
            const feature = geo.type === 'FeatureCollection' ? geo : {
              type: 'FeatureCollection',
              features: [{ type: 'Feature', properties: { name: part.name }, geometry: geo.type === 'Feature' ? geo.geometry : geo }],
            };
            L.geoJSON(feature, {
              style: {
                color: coloursN[part.name] || '#64748b',
                weight: 1.5,
                opacity: 0.85,
                fillColor: coloursN[part.name] || '#64748b',
                fillOpacity: 0.06,
              },
              onEachFeature: (f, layer) => {
                layer.bindTooltip(part.name, { sticky: true, className: 'station-label' });
              },
            }).addTo(countyLayer);
            ok++;
          } catch (e) { /* skip */ }
        }
        if (ok === 0) {
          setStatus('Nation boundaries could not be loaded. Station borders still work.', true);
          return false;
        }
        countiesLoaded = true;
        setStatus('Showing England · Scotland · Wales · Northern Ireland outlines.');
        return true;
      }

      function redraw() {
        stationLayer.clearLayers();
        coverageLayer.clearLayers();
        dcLayer.clearLayers();

        const list = stations.filter(s => {
          if (filter !== 'all' && bucket(s.type) !== filter) return false;
          if (dcFilter && String(s.dcId) !== dcFilter) return false;
          return true;
        });

        const zoom = map.getZoom();
        const labelsOk = showLabels && zoom >= 9;

        list.forEach(s => {
          const c = colours[bucket(s.type)] || colours.other;
          const isDc = s.typeId === 7;
          const m = L.circleMarker([s.lat, s.lon], {
            radius: isDc ? 8 : 5,
            color: isDc ? '#fff' : c,
            weight: isDc ? 2 : 1,
            fillColor: isDc ? (dcColour[s.id] || c) : c,
            fillOpacity: 0.9,
          });
          m.bindPopup(
            '<strong>' + (s.name || 'Unnamed').replace(/</g, '&lt;') + '</strong><br>' +
            (s.type || '') +
            (s.dcName ? '<br>DC: ' + String(s.dcName).replace(/</g, '&lt;') : '') +
            '<br><a href="/stations/?id=' + s.id + '">Details</a>' +
            (s.dcId ? ' · <a href="/dispatch/?id=' + s.dcId + '">Dispatch</a>' : '')
          );
          m.addTo(stationLayer);
          if (labelsOk && !isDc) {
            m.bindTooltip(s.name || '', {
              permanent: true, direction: 'top', offset: [0, -6],
              className: 'station-label', opacity: 0.95,
            });
          }
        });

        const dcsToShow = dcs.filter(d => !dcFilter || String(d.id) === dcFilter);
        if (showCoverage) {
          dcsToShow.forEach(d => {
            const poly = coverageByDc[d.id];
            if (!poly || poly.length < 3) return;
            const col = dcColour[d.id] || '#ef4444';
            L.polygon(poly, {
              color: col, weight: 2.5, opacity: 0.95,
              fillColor: col, fillOpacity: 0.12,
            }).bindPopup(
              '<strong>' + String(d.name || 'DC').replace(/</g, '&lt;') + '</strong><br>' +
              (d.stationCount || 0) + ' stations<br>Hull of assigned stations<br>' +
              '<a href="/dispatch/?id=' + d.id + '">Open dashboard</a>'
            ).addTo(coverageLayer);
          });
        }

        dcsToShow.forEach(d => {
          const col = dcColour[d.id] || '#3b82f6';
          const m = L.circleMarker([d.lat, d.lon], {
            radius: 9, color: '#fff', weight: 2, fillColor: col, fillOpacity: 1,
          });
          m.bindPopup(
            '<strong>' + String(d.name || 'DC').replace(/</g, '&lt;') + '</strong><br>Dispatch Centre<br>' +
            (d.stationCount || 0) + ' stations · ' + (d.personnel || 0) + ' personnel<br>' +
            '<a href="/dispatch/?id=' + d.id + '">Open dashboard</a>'
          );
          m.addTo(dcLayer);
          if (showLabels && zoom >= 8) {
            m.bindTooltip(d.name || 'DC', {
              permanent: true, direction: 'right', offset: [10, 0],
              className: 'dc-label', opacity: 0.95,
            });
          }
        });

        document.querySelector('[data-map-count]').textContent = String(list.length);
      }

      redraw();
      map.on('zoomend', () => redraw());

      const focus = new URLSearchParams(location.search).get('focus');
      if (focus) {
        const s = stations.find(x => String(x.id) === String(focus));
        if (s) map.setView([s.lat, s.lon], 12);
      }
      const focusDc = new URLSearchParams(location.search).get('dc');
      if (focusDc) {
        sel.value = focusDc;
        dcFilter = focusDc;
        redraw();
        const d = dcs.find(x => String(x.id) === String(focusDc));
        if (d) map.setView([d.lat, d.lon], 10);
      }

      document.querySelectorAll('[data-map-filter]').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('[data-map-filter]').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          filter = btn.getAttribute('data-map-filter');
          redraw();
        });
      });
      sel.addEventListener('change', () => { dcFilter = sel.value; redraw(); });
      document.getElementById('show-coverage').addEventListener('change', e => {
        showCoverage = e.target.checked; redraw();
      });
      document.getElementById('show-labels').addEventListener('change', e => {
        showLabels = e.target.checked; redraw();
      });
      document.getElementById('show-counties').addEventListener('change', async e => {
        showCounties = e.target.checked;
        if (showCounties) {
          const ok = await loadCounties();
          if (ok && !map.hasLayer(countyLayer)) countyLayer.addTo(map);
          if (!ok) document.getElementById('show-counties').checked = false;
        } else {
          map.removeLayer(countyLayer);
          setStatus('');
        }
      });
    });
  </script>
</body>
</html>
