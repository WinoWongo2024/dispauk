name: Sync MissionChief Data

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fetch MissionChief data
        env:
          SESSION: ${{ secrets.MISSIONCHIEF_SESSION }}
          MC_BASE: https://www.missionchief.co.uk
        run: |
          set -euo pipefail

          if [ -z "${SESSION:-}" ]; then
            echo "::error::MISSIONCHIEF_SESSION secret is not set."
            echo "Settings → Secrets and variables → Actions → MISSIONCHIEF_SESSION"
            echo "Value must look like: _session_id=YOUR_VALUE"
            exit 1
          fi

          # Normalise cookie: allow raw value or full Cookie header fragment
          COOKIE="$SESSION"
          if [[ "$COOKIE" != *"="* ]]; then
            COOKIE="_session_id=${COOKIE}"
            echo "Normalised cookie to include _session_id= prefix"
          fi

          # Never print the full cookie
          echo "Cookie length: ${#COOKIE} chars"
          echo "Cookie starts with: ${COOKIE%%=*}=***"

          mkdir -p data

          fetch_api() {
            local name="$1"
            local path="$2"
            local out="$3"
            local code

            echo "--- Fetching ${name} (${MC_BASE}${path}) ---"

            code=$(curl -sS -L -o "$out" -w "%{http_code}" \
              -H "Cookie: ${COOKIE}" \
              -H "Accept: application/json, text/javascript, */*;q=0.01" \
              -H "Accept-Language: en-GB,en;q=0.9" \
              -H "X-Requested-With: XMLHttpRequest" \
              -H "Referer: ${MC_BASE}/" \
              -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
              "${MC_BASE}${path}" || true)

            echo "HTTP status: ${code}"

            if [ "$code" != "200" ]; then
              echo "::error::${name} failed with HTTP ${code}"
              echo "Response body (first 500 chars):"
              head -c 500 "$out" || true
              echo
              if [ "$code" = "401" ] || [ "$code" = "403" ] || [ "$code" = "302" ]; then
                echo "::error::Session cookie looks invalid or expired. Log into missionchief.co.uk, copy a fresh _session_id, update the secret, and re-run."
              fi
              exit 22
            fi

            # Basic JSON sanity
            if ! python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$out" 2>/dev/null; then
              echo "::error::${name} response is not valid JSON"
              head -c 500 "$out" || true
              exit 1
            fi

            python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(f'{sys.argv[2]}: {len(d) if isinstance(d,list) else type(d).__name__}')" "$out" "$name"
          }

          fetch_api "buildings" "/api/buildings" /tmp/buildings.json
          fetch_api "vehicles" "/api/vehicles" /tmp/vehicles.json

      - name: Build public stats
        run: |
          python3 << 'PY'
          import json
          from datetime import datetime, timezone
          from collections import Counter

          with open("/tmp/buildings.json") as f:
              buildings = json.load(f)
          with open("/tmp/vehicles.json") as f:
              vehicles = json.load(f)

          if not isinstance(buildings, list) or not isinstance(vehicles, list):
              raise SystemExit("Expected list responses from buildings/vehicles APIs")

          BUILDING_LABELS = {
              0: "Fire Station",
              1: "Fire Station",
              2: "Ambulance Station",
              3: "Police Station",
              4: "Hospital",
              5: "Helicopter Station",
              6: "Police Station",
              7: "Dispatch Centre",
              13: "Police Station",
              14: "Ambulance Station",
              15: "Fire Station",
          }

          stations = []
          for b in buildings:
              stations.append({
                  "id": b.get("id"),
                  "name": b.get("caption") or "Unnamed",
                  "type": BUILDING_LABELS.get(b.get("building_type"), f"Type {b.get('building_type')}"),
                  "typeId": b.get("building_type"),
                  "level": b.get("level"),
                  "lat": b.get("latitude"),
                  "lon": b.get("longitude"),
                  "personnel": b.get("personal_count"),
              })

          status_counts = Counter()
          for v in vehicles:
              status_counts[str(v.get("fms_show", "unknown"))] += 1

          stats = {
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "source": "missionchief.co.uk",
              "totals": {
                  "stations": len(buildings),
                  "units": len(vehicles),
              },
              "stations": stations,
              "vehicleStatus": dict(status_counts),
          }

          with open("data/stats.json", "w") as f:
              json.dump(stats, f, indent=2, ensure_ascii=False)
              f.write("\n")

          print(f"Wrote data/stats.json — {len(stations)} stations, {len(vehicles)} units")
          PY

      - name: Commit if changed
        run: |
          git config user.name "DispaUK Sync"
          git config user.email "actions@dispauk.co.uk"
          git add data/stats.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: sync MissionChief stats $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
