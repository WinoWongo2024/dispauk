name: Sync MissionChief Data

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fetch all MissionChief APIs
        env:
          SESSION: ${{ secrets.MISSIONCHIEF_SESSION }}
          MC_BASE: https://www.missionchief.co.uk
        run: |
          set -euo pipefail

          if [ -z "${SESSION:-}" ]; then
            echo "::error::MISSIONCHIEF_SESSION secret is not set."
            exit 1
          fi

          COOKIE="$SESSION"
          if [[ "$COOKIE" != *"="* ]]; then
            COOKIE="_session_id=${COOKIE}"
          fi

          echo "Cookie length: ${#COOKIE} chars"
          mkdir -p /tmp/mc data
          START_TS=$(date +%s)

          fetch_api() {
            local name="$1" path="$2" out="$3" required="${4:-1}"
            local code
            echo "--- ${name}: ${MC_BASE}${path} ---"
            code=$(curl -sS -L -o "$out" -w "%{http_code}" \
              --connect-timeout 20 --max-time 60 \
              -H "Cookie: ${COOKIE}" \
              -H "Accept: application/json, text/javascript, */*;q=0.01" \
              -H "Accept-Language: en-GB,en;q=0.9" \
              -H "X-Requested-With: XMLHttpRequest" \
              -H "Referer: ${MC_BASE}/" \
              -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
              "${MC_BASE}${path}" || true)
            echo "HTTP ${code}"
            sleep 1
            if [ "$code" != "200" ]; then
              if [ "$required" = "1" ]; then
                echo "::error::${name} failed HTTP ${code}"
                head -c 400 "$out" || true; echo
                if [ "$code" = "401" ] || [ "$code" = "403" ] || [ "$code" = "302" ]; then
                  echo "::error::Session cookie invalid/expired — update MISSIONCHIEF_SESSION"
                fi
                exit 22
              fi
              echo "::warning::Optional ${name} failed HTTP ${code} — skipping"
              rm -f "$out"
              return 0
            fi
            if ! python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$out" 2>/dev/null; then
              if [ "$required" = "1" ]; then
                echo "::error::${name} not valid JSON"; exit 1
              fi
              echo "::warning::Optional ${name} not JSON — skipping"
              rm -f "$out"
              return 0
            fi
            python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(sys.argv[2]+':', len(d) if isinstance(d,list) else type(d).__name__)" "$out" "$name"
          }

          fetch_api buildings "/api/buildings" /tmp/mc/buildings.json 1
          fetch_api vehicles "/api/vehicles" /tmp/mc/vehicles.json 1
          fetch_api vehicle_states "/api/vehicle_states" /tmp/mc/vehicle_states.json 0
          fetch_api credits "/api/credits" /tmp/mc/credits.json 0
          fetch_api allianceinfo "/api/allianceinfo" /tmp/mc/allianceinfo.json 0
          fetch_api alliance_buildings "/api/alliance_buildings" /tmp/mc/alliance_buildings.json 0
          fetch_api equipments "/api/equipments" /tmp/mc/equipments.json 0
          fetch_api vehicle_distances "/api/v1/vehicle_distances" /tmp/mc/vehicle_distances.json 0
          fetch_api einsaetze "/einsaetze.json" /tmp/mc/einsaetze.json 0
          fetch_api alliance_event_types "/alliance_event_types.json" /tmp/mc/alliance_event_types.json 0

          echo "$(( $(date +%s) - START_TS ))" > /tmp/mc/duration_secs.txt

      - name: Build public stats + history
        run: |
          python3 << 'PY'
          import json, os, math
          from datetime import datetime, timezone
          from collections import Counter, defaultdict

          def load(path):
              if not os.path.isfile(path):
                  return None
              with open(path) as f:
                  return json.load(f)

          def haversine_m(lat1, lon1, lat2, lon2):
              R = 6371000.0
              p1, p2 = math.radians(lat1), math.radians(lat2)
              dp = math.radians(lat2 - lat1)
              dl = math.radians(lon2 - lon1)
              a = math.sin(dp/2)**2 + math.cos(p1)*math.cos(p2)*math.sin(dl/2)**2
              return 2 * R * math.asin(math.sqrt(a))

          def convex_hull(points):
              """Andrew's monotone chain. points = [(lat, lon), ...]. Returns [[lat, lon], ...]."""
              pts = sorted(set((float(lat), float(lon)) for lat, lon in points))
              if len(pts) <= 2:
                  return [[p[0], p[1]] for p in pts]
              # Work in (lon, lat) for geographic x/y
              xy = [(p[1], p[0]) for p in pts]

              def cross(o, a, b):
                  return (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0])

              lower = []
              for p in xy:
                  while len(lower) >= 2 and cross(lower[-2], lower[-1], p) <= 0:
                      lower.pop()
                  lower.append(p)
              upper = []
              for p in reversed(xy):
                  while len(upper) >= 2 and cross(upper[-2], upper[-1], p) <= 0:
                      upper.pop()
                  upper.append(p)
              hull = lower[:-1] + upper[:-1]
              # Return as [lat, lon] for Leaflet
              return [[p[1], p[0]] for p in hull]

          buildings = load("/tmp/mc/buildings.json") or []
          vehicles = load("/tmp/mc/vehicles.json") or []
          vehicle_states = load("/tmp/mc/vehicle_states.json")
          credits = load("/tmp/mc/credits.json")
          allianceinfo = load("/tmp/mc/allianceinfo.json")
          alliance_buildings = load("/tmp/mc/alliance_buildings.json")
          equipments = load("/tmp/mc/equipments.json")
          einsaetze = load("/tmp/mc/einsaetze.json")

          duration = None
          try:
              duration = int(open("/tmp/mc/duration_secs.txt").read().strip())
          except Exception:
              pass

          BUILDING_LABELS = {
              0: "Fire Station", 1: "Fire Station (Large)", 2: "Ambulance Station",
              3: "Police Station", 4: "Hospital", 5: "Helicopter Station",
              6: "Police Station", 7: "Dispatch Centre", 8: "Police Academy",
              13: "Police Aviation", 14: "Ambulance Station", 15: "Fire Station",
              21: "Health Centre", 22: "Home Response / HRL",
              25: "HART Base", 27: "Lifeboat Station", 28: "Coastguard Station",
              29: "SAR Resource Centre", 30: "Coastguard CRH", 31: "Search & Rescue HQ",
              32: "GP Surgery", 33: "Mountain Rescue", 34: "Workshop / RCC",
              35: "Bomb Disposal", 36: "Custody Suite",
          }

          def region_for(lat, lon):
              if lat is None or lon is None:
                  return "Unknown"
              if lat >= 54.8 and lon < -5.5:
                  return "Northern Ireland"
              if lat >= 55.0:
                  return "Scotland"
              if lat < 53.5 and lon < -3.0 and lat > 51.3:
                  return "Wales"
              if lat >= 53.5:
                  return "North"
              if lat >= 52.2:
                  return "Midlands"
              if lat >= 51.2 and lon > -0.5:
                  return "South East"
              if lat >= 50.0 and lon < -1.5:
                  return "South West"
              if lat >= 51.2:
                  return "London & South"
              return "Other / Overseas"

          def extract_dc_id(b):
              for key in (
                  "leitstelle_building_id", "leitstelle_id", "control_center_id",
                  "dispatch_center_id", "leitstelle", "related_building_id",
              ):
                  val = b.get(key)
                  if val is None or val is False or val == "" or val == 0:
                      continue
                  if isinstance(val, dict):
                      val = val.get("id") or val.get("building_id")
                  try:
                      return int(val)
                  except (TypeError, ValueError):
                      continue
              return None

          by_id = {b.get("id"): b for b in buildings if b.get("id") is not None}
          dcs_raw = [b for b in buildings if b.get("building_type") == 7]
          dc_ids = {b.get("id") for b in dcs_raw}

          stations = []
          type_counts = Counter()
          region_counts = Counter()
          total_personnel = 0
          missing_name = missing_coords = 0
          assigned_from_api = 0
          assigned_nearest = 0

          dc_coords = []
          for d in dcs_raw:
              lat, lon = d.get("latitude"), d.get("longitude")
              if lat is None or lon is None:
                  continue
              dc_coords.append((d.get("id"), d.get("caption") or "Dispatch Centre", float(lat), float(lon)))

          for b in buildings:
              label = BUILDING_LABELS.get(b.get("building_type"), f"Type {b.get('building_type')}")
              type_counts[label] += 1
              pc = b.get("personal_count") or 0
              total_personnel += pc if isinstance(pc, int) else 0
              lat, lon = b.get("latitude"), b.get("longitude")
              region = region_for(lat, lon)
              region_counts[region] += 1
              name = b.get("caption") or "Unnamed"
              if not b.get("caption"):
                  missing_name += 1
              if lat is None or lon is None:
                  missing_coords += 1

              dc_id = extract_dc_id(b)
              assign_method = None
              if b.get("building_type") == 7:
                  dc_id = b.get("id")
                  assign_method = "self"
              elif dc_id is not None and dc_id in dc_ids:
                  assign_method = "api"
                  assigned_from_api += 1
              elif lat is not None and lon is not None and dc_coords:
                  best = None
                  best_d = None
                  for did, dname, dlat, dlon in dc_coords:
                      dist = haversine_m(float(lat), float(lon), dlat, dlon)
                      if best_d is None or dist < best_d:
                          best_d = dist
                          best = (did, dname)
                  if best:
                      dc_id = best[0]
                      assign_method = "nearest"
                      assigned_nearest += 1

              dc_name = None
              if dc_id is not None and dc_id in by_id:
                  dc_name = by_id[dc_id].get("caption") or "Dispatch Centre"

              stations.append({
                  "id": b.get("id"),
                  "name": name,
                  "type": label,
                  "typeId": b.get("building_type"),
                  "level": b.get("level"),
                  "lat": lat,
                  "lon": lon,
                  "personnel": b.get("personal_count"),
                  "small": b.get("small_building"),
                  "region": region,
                  "dcId": dc_id,
                  "dcName": dc_name,
                  "dcAssign": assign_method,
              })

          stations_by_dc = defaultdict(list)
          for s in stations:
              if s.get("dcId") is not None and s.get("typeId") != 7:
                  stations_by_dc[s["dcId"]].append(s)

          dispatch_centres = []
          for d in dcs_raw:
              did = d.get("id")
              dlat, dlon = d.get("latitude"), d.get("longitude")
              members = stations_by_dc.get(did, [])
              max_m = 0.0
              pts = []
              if dlat is not None and dlon is not None:
                  pts.append((float(dlat), float(dlon)))
              for s in members:
                  if s.get("lat") is None or s.get("lon") is None:
                      continue
                  pts.append((float(s["lat"]), float(s["lon"])))
                  if dlat is not None and dlon is not None:
                      dist = haversine_m(float(dlat), float(dlon), float(s["lat"]), float(s["lon"]))
                      if dist > max_m:
                          max_m = dist

              hull = convex_hull(pts) if len(pts) >= 3 else None
              # If only 1–2 points, no real border — omit polygon
              if hull and len(hull) < 3:
                  hull = None

              radius_m = int(max(max_m * 1.05, 3000)) if members else 2500
              personnel = sum((s.get("personnel") or 0) if isinstance(s.get("personnel"), int) else 0 for s in members)
              dispatch_centres.append({
                  "id": did,
                  "name": d.get("caption") or "Dispatch Centre",
                  "lat": dlat,
                  "lon": dlon,
                  "level": d.get("level"),
                  "stationCount": len(members),
                  "personnel": personnel,
                  "coverageRadiusM": radius_m,
                  "coveragePolygon": hull,
                  "region": region_for(dlat, dlon),
              })

          dispatch_centres.sort(key=lambda x: (-x["stationCount"], x["name"] or ""))

          status_counts = Counter()
          type_vehicle_counts = Counter()
          for v in vehicles:
              status_counts[str(v.get("fms_show", "unknown"))] += 1
              vt = v.get("vehicle_type_caption") or str(v.get("vehicle_type", "?"))
              type_vehicle_counts[str(vt)] += 1

          units_sample = []
          for v in vehicles[:120]:
              units_sample.append({
                  "id": v.get("id"),
                  "name": v.get("caption") or "Unnamed",
                  "type": v.get("vehicle_type_caption") or v.get("vehicle_type"),
                  "buildingId": v.get("building_id"),
                  "status": v.get("fms_show"),
              })

          # Public credits — only non-sensitive numeric fields
          credits_public = None
          if isinstance(credits, dict):
              allow = (
                  "credits_user_current", "credits_user_total",
                  "credits_alliance_current", "alliance_funds",
                  "coins_user_current",
              )
              credits_public = {}
              for k in allow:
                  if k in credits and isinstance(credits[k], (int, float)):
                      credits_public[k] = credits[k]
              # Also accept any other numeric credit-like keys without strings/tokens
              for k, v in credits.items():
                  if k in credits_public:
                      continue
                  if "credit" in k.lower() or "coin" in k.lower() or "fund" in k.lower():
                      if isinstance(v, (int, float)) and not isinstance(v, bool):
                          credits_public[k] = v
              if not credits_public:
                  credits_public = None

          alliance_public = None
          if isinstance(allianceinfo, dict):
              alliance_public = {
                  "users": allianceinfo.get("user_count"),
                  "online": allianceinfo.get("user_online_count"),
                  "rank": allianceinfo.get("rank"),
                  "financeActive": allianceinfo.get("finance_active"),
              }

          mission_types_count = None
          if isinstance(einsaetze, dict):
              mission_types_count = len(einsaetze)
          elif isinstance(einsaetze, list):
              mission_types_count = len(einsaetze)

          now = datetime.now(timezone.utc).isoformat()

          quality = {
              "stationsMissingName": missing_name,
              "stationsMissingCoords": missing_coords,
              "duplicateStationIds": len(buildings) - len({b.get("id") for b in buildings}),
              "dcAssignedFromApi": assigned_from_api,
              "dcAssignedNearest": assigned_nearest,
              "dispatchCentres": len(dispatch_centres),
              "ok": missing_name == 0 and missing_coords < max(5, len(buildings) * 0.05),
          }

          stats = {
              "updatedAt": now,
              "source": "missionchief.co.uk",
              "sync": {"durationSeconds": duration, "schedule": "hourly"},
              "endpoints": {
                  "buildings": True,
                  "vehicles": True,
                  "vehicle_states": vehicle_states is not None,
                  "credits": credits is not None,
                  "allianceinfo": allianceinfo is not None,
                  "alliance_buildings": alliance_buildings is not None,
                  "equipments": equipments is not None,
                  "einsaetze": einsaetze is not None,
              },
              "totals": {
                  "stations": len(buildings),
                  "units": len(vehicles),
                  "personnel": total_personnel,
                  "dispatchCentres": len(dispatch_centres),
                  "allianceBuildings": len(alliance_buildings) if isinstance(alliance_buildings, list) else None,
                  "equipments": len(equipments) if isinstance(equipments, list) else None,
                  "missionTypes": mission_types_count,
              },
              "stationsByType": dict(type_counts),
              "stationsByRegion": dict(region_counts),
              "vehicleStatus": dict(status_counts) if status_counts else (vehicle_states if isinstance(vehicle_states, dict) else {}),
              "vehiclesByType": dict(type_vehicle_counts.most_common(30)),
              "quality": quality,
              "dispatchCentres": dispatch_centres,
              "stations": stations,
              "unitsSample": units_sample,
              "credits": credits_public,
              "alliance": alliance_public,
          }

          if len(buildings) < 1 or len(vehicles) < 1:
              raise SystemExit("Refusing to publish empty buildings/vehicles dataset")

          with open("data/stats.json", "w") as f:
              json.dump(stats, f, indent=2, ensure_ascii=False)
              f.write("\n")

          hist_path = "data/history.json"
          history = load(hist_path) or []
          if not isinstance(history, list):
              history = []
          hist_row = {
              "at": now,
              "stations": len(buildings),
              "units": len(vehicles),
              "personnel": total_personnel,
              "dispatchCentres": len(dispatch_centres),
              "durationSeconds": duration,
              "ok": True,
          }
          if credits_public and "credits_user_current" in credits_public:
              hist_row["creditsCurrent"] = credits_public["credits_user_current"]
          history.append(hist_row)
          history = history[-168:]
          with open(hist_path, "w") as f:
              json.dump(history, f, indent=2, ensure_ascii=False)
              f.write("\n")

          print("DCs", len(dispatch_centres), "hulls",
                sum(1 for d in dispatch_centres if d.get("coveragePolygon")),
                "api-assign", assigned_from_api, "nearest", assigned_nearest)
          print("Credits", credits_public)
          print("Wrote stats + history", len(stations), "stations", len(vehicles), "units")
          PY

      - name: Commit if changed
        run: |
          git config user.name "DispaUK Sync"
          git config user.email "actions@dispauk.co.uk"
          git add data/stats.json data/history.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: sync MissionChief stats $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
