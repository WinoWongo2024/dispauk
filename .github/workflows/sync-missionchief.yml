name: Sync MissionChief Data

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fetch all MissionChief APIs
        env:
          SESSION: ${{ secrets.MISSIONCHIEF_SESSION }}
          MC_BASE: https://www.missionchief.co.uk
        run: |
          set -euo pipefail

          if [ -z "${SESSION:-}" ]; then
            echo "::error::MISSIONCHIEF_SESSION secret is not set."
            exit 1
          fi

          COOKIE="$SESSION"
          if [[ "$COOKIE" != *"="* ]]; then
            COOKIE="_session_id=${COOKIE}"
          fi

          echo "Cookie length: ${#COOKIE} chars"
          mkdir -p /tmp/mc data

          # required=1 fails the job; required=0 is best-effort
          fetch_api() {
            local name="$1" path="$2" out="$3" required="${4:-1}"
            local code
            echo "--- ${name}: ${MC_BASE}${path} ---"
            code=$(curl -sS -L -o "$out" -w "%{http_code}" \
              -H "Cookie: ${COOKIE}" \
              -H "Accept: application/json, text/javascript, */*;q=0.01" \
              -H "Accept-Language: en-GB,en;q=0.9" \
              -H "X-Requested-With: XMLHttpRequest" \
              -H "Referer: ${MC_BASE}/" \
              -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
              "${MC_BASE}${path}" || true)
            echo "HTTP ${code}"
            if [ "$code" != "200" ]; then
              if [ "$required" = "1" ]; then
                echo "::error::${name} failed HTTP ${code}"
                head -c 400 "$out" || true; echo
                if [ "$code" = "401" ] || [ "$code" = "403" ] || [ "$code" = "302" ]; then
                  echo "::error::Session cookie invalid/expired — update MISSIONCHIEF_SESSION"
                fi
                exit 22
              fi
              echo "::warning::Optional ${name} failed HTTP ${code} — skipping"
              rm -f "$out"
              return 0
            fi
            if ! python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$out" 2>/dev/null; then
              if [ "$required" = "1" ]; then
                echo "::error::${name} not valid JSON"; exit 1
              fi
              echo "::warning::Optional ${name} not JSON — skipping"
              rm -f "$out"
              return 0
            fi
            python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(sys.argv[2]+':', len(d) if isinstance(d,list) else type(d).__name__)" "$out" "$name"
          }

          # Required
          fetch_api buildings "/api/buildings" /tmp/mc/buildings.json 1
          fetch_api vehicles "/api/vehicles" /tmp/mc/vehicles.json 1

          # Optional authenticated
          fetch_api vehicle_states "/api/vehicle_states" /tmp/mc/vehicle_states.json 0
          fetch_api credits "/api/credits" /tmp/mc/credits.json 0
          fetch_api allianceinfo "/api/allianceinfo" /tmp/mc/allianceinfo.json 0
          fetch_api alliance_buildings "/api/alliance_buildings" /tmp/mc/alliance_buildings.json 0
          fetch_api equipments "/api/equipments" /tmp/mc/equipments.json 0
          fetch_api vehicle_distances "/api/v1/vehicle_distances" /tmp/mc/vehicle_distances.json 0

          # Public (no auth strictly required, but send cookie anyway)
          fetch_api einsaetze "/einsaetze.json" /tmp/mc/einsaetze.json 0
          fetch_api alliance_event_types "/alliance_event_types.json" /tmp/mc/alliance_event_types.json 0

      - name: Build public stats.json
        run: |
          python3 << 'PY'
          import json, os
          from datetime import datetime, timezone
          from collections import Counter

          def load(path):
              if not os.path.isfile(path):
                  return None
              with open(path) as f:
                  return json.load(f)

          buildings = load("/tmp/mc/buildings.json") or []
          vehicles = load("/tmp/mc/vehicles.json") or []
          vehicle_states = load("/tmp/mc/vehicle_states.json")
          credits = load("/tmp/mc/credits.json")
          allianceinfo = load("/tmp/mc/allianceinfo.json")
          alliance_buildings = load("/tmp/mc/alliance_buildings.json")
          equipments = load("/tmp/mc/equipments.json")
          vehicle_distances = load("/tmp/mc/vehicle_distances.json")
          einsaetze = load("/tmp/mc/einsaetze.json")
          alliance_event_types = load("/tmp/mc/alliance_event_types.json")

          BUILDING_LABELS = {
              0: "Fire Station", 1: "Fire Station", 2: "Ambulance Station",
              3: "Police Station", 4: "Hospital", 5: "Helicopter Station",
              6: "Police Station", 7: "Dispatch Centre", 13: "Police Station",
              14: "Ambulance Station", 15: "Fire Station",
          }

          stations = []
          type_counts = Counter()
          total_personnel = 0
          for b in buildings:
              label = BUILDING_LABELS.get(b.get("building_type"), f"Type {b.get('building_type')}")
              type_counts[label] += 1
              pc = b.get("personal_count") or 0
              total_personnel += pc if isinstance(pc, int) else 0
              stations.append({
                  "id": b.get("id"),
                  "name": b.get("caption") or "Unnamed",
                  "type": label,
                  "typeId": b.get("building_type"),
                  "level": b.get("level"),
                  "lat": b.get("latitude"),
                  "lon": b.get("longitude"),
                  "personnel": b.get("personal_count"),
                  "small": b.get("small_building"),
              })

          status_counts = Counter()
          type_vehicle_counts = Counter()
          for v in vehicles:
              status_counts[str(v.get("fms_show", "unknown"))] += 1
              vt = v.get("vehicle_type_caption") or str(v.get("vehicle_type", "?"))
              type_vehicle_counts[str(vt)] += 1

          units_sample = []
          for v in vehicles[:80]:
              units_sample.append({
                  "id": v.get("id"),
                  "name": v.get("caption") or "Unnamed",
                  "type": v.get("vehicle_type_caption") or v.get("vehicle_type"),
                  "buildingId": v.get("building_id"),
                  "status": v.get("fms_show"),
              })

          # Public-safe credits summary only
          credits_public = None
          if isinstance(credits, dict):
              credits_public = {k: credits[k] for k in ("credits_user_current", "credits_user_total", "alliance_funds") if k in credits}
              if not credits_public:
                  # keep only numeric top-level keys, cap size
                  credits_public = {k: v for k, v in list(credits.items())[:12] if isinstance(v, (int, float, bool, str))}

          alliance_public = None
          if isinstance(allianceinfo, dict):
              alliance_public = {
                  "users": allianceinfo.get("user_count"),
                  "online": allianceinfo.get("user_online_count"),
                  "rank": allianceinfo.get("rank"),
                  "financeActive": allianceinfo.get("finance_active"),
              }

          mission_types_count = None
          if isinstance(einsaetze, dict):
              mission_types_count = len(einsaetze)
          elif isinstance(einsaetze, list):
              mission_types_count = len(einsaetze)

          stats = {
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "source": "missionchief.co.uk",
              "endpoints": {
                  "buildings": True,
                  "vehicles": True,
                  "vehicle_states": vehicle_states is not None,
                  "credits": credits is not None,
                  "allianceinfo": allianceinfo is not None,
                  "alliance_buildings": alliance_buildings is not None,
                  "equipments": equipments is not None,
                  "vehicle_distances": vehicle_distances is not None,
                  "einsaetze": einsaetze is not None,
                  "alliance_event_types": alliance_event_types is not None,
              },
              "totals": {
                  "stations": len(buildings),
                  "units": len(vehicles),
                  "personnel": total_personnel,
                  "allianceBuildings": len(alliance_buildings) if isinstance(alliance_buildings, list) else None,
                  "equipments": len(equipments) if isinstance(equipments, list) else None,
                  "missionTypes": mission_types_count,
              },
              "stationsByType": dict(type_counts),
              "vehicleStatus": dict(status_counts) if status_counts else (vehicle_states if isinstance(vehicle_states, dict) else {}),
              "vehiclesByType": dict(type_vehicle_counts.most_common(25)),
              "stations": stations,
              "unitsSample": units_sample,
              "credits": credits_public,
              "alliance": alliance_public,
          }

          with open("data/stats.json", "w") as f:
              json.dump(stats, f, indent=2, ensure_ascii=False)
              f.write("\n")

          print("Wrote data/stats.json")
          print("stations", stats["totals"]["stations"], "units", stats["totals"]["units"])
          print("endpoints", stats["endpoints"])
          PY

      - name: Commit if changed
        run: |
          git config user.name "DispaUK Sync"
          git config user.email "actions@dispauk.co.uk"
          git add data/stats.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: sync MissionChief stats $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
